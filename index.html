<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Lepas — Hapus Background Foto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #FDF6E9;
    --ink: #101010;
    --panel: #FFFFFF;
    --accent: #FF3B30;
    --accent-2: #2B6CFF;
    --accent-3: #FFD400;
    --bw: 3px;
    --shadow: 7px 7px 0 var(--ink);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; overflow-x:hidden; max-width:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family:"Space Grotesk", system-ui, sans-serif;
    min-height:100vh;
    width:100%;
    touch-action: manipulation;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    background-image:
      linear-gradient(var(--ink) 1px, transparent 1px),
      linear-gradient(90deg, var(--ink) 1px, transparent 1px);
    background-size: 36px 36px;
    background-position: -1px -1px;
    background-color: var(--bg);
  }
  .gate{
    background: var(--panel);
    border: var(--bw) solid var(--ink);
    box-shadow: var(--shadow);
    max-width: 480px;
    width:100%;
    padding: 36px 32px 32px;
    text-align:center;
  }
  .tag{
    display:inline-block;
    background: var(--accent-3);
    border: 2px solid var(--ink);
    font-family:"IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding: 4px 10px;
    margin-bottom: 18px;
    transform: rotate(-2deg);
  }
  h1{
    font-family:"Archivo Black", sans-serif;
    font-size: 34px;
    line-height:1.05;
    margin: 0 0 14px;
  }
  h1 span{
    background: var(--accent-2);
    color: #fff;
    padding: 0 8px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  p{
    margin: 0 0 28px;
    font-size: 14.5px;
    line-height:1.6;
    color:#3A3A3A;
  }
  button{
    font-family:"Space Grotesk", sans-serif;
    font-weight:700;
    font-size: 16px;
    background: var(--accent);
    color: #fff;
    border: var(--bw) solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 15px 26px;
    cursor:pointer;
    width:100%;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover{ filter: brightness(1.04); }
  button:active{
    transform: translate(5px, 5px);
    box-shadow: 0 0 0 var(--ink);
  }
  .foot{
    margin-top: 18px;
    font-family:"IBM Plex Mono", monospace;
    font-size: 11px;
    color:#8A8A8A;
  }
</style>
</head>
<body>

  <div class="gate">
    <span class="tag">FOTO TIDAK DIUNGGAH KE SERVER</span>
    <h1>Copot <span>background</span> foto kamu.</h1>
    <p>Alat hapus background yang jalan langsung di browser. Klik tombol di bawah buat masuk ke tools-nya.</p>
    <button id="enterBtn">Buka Tools →</button>
    <div class="foot">gratis · tanpa limit · tanpa upload ke server</div>
  </div>

<script src="anti-clone.js"></script>
<script>
  document.getElementById('enterBtn').addEventListener('click', function () {
    window.location.href = 'app.html';
  });
</script>
</body>
</html>
